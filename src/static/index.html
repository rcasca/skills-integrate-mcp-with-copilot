<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="account-controls">
          <button id="account-button" class="secondary-button" type="button">Teacher Login</button>
          <div id="account-status" class="account-status hidden"></div>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Teacher Tools</h3>
        <p id="teacher-tools-copy" class="teacher-tools-copy">
          Sign in as a teacher to register or unregister students for activities.
        </p>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="auth-modal-title">Teacher Login</h3>
          <button id="close-auth-modal" class="icon-button" type="button" aria-label="Close login dialog">✕</button>
        </div>
        <form id="auth-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>
          <div class="modal-actions">
            <button type="submit">Sign In</button>
          </div>
        </form>
        <p class="auth-hint">Teacher accounts are managed by the school.</p>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
